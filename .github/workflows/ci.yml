name: Docs quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-quality:
    name: Docs quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Check formatting
        run: bunx --bun prettier@3.9.6 --check . --ignore-unknown

      - name: Lint Markdown
        run: bunx --bun markdownlint-cli2@0.23.1

      - name: Check local links
        run: bun .github/scripts/check-docs.mjs links

      - name: Check documentation metadata
        run: bun .github/scripts/check-docs.mjs metadata

      - name: Enforce English-only Markdown
        run: bun .github/scripts/check-docs.mjs language

      - name: Check documentation file budgets
        run: bun .github/scripts/check-docs.mjs agents

      - name: Check repository hygiene
        run: bun .github/scripts/check-docs.mjs hygiene

      - name: Validate architecture SVG assets
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends libxml2-utils
          git ls-files -z --cached --others --exclude-standard -- '*.svg' | xargs -0 -r xmllint --noout

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck=

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Install the pinned upstream gitleaks release from shell steps only.
      # The justfile owns the version pin (`gitleaks_version`); this step parses
      # that line so the workflow and local `just secrets` cannot drift, and the
      # release asset names (gitleaks_<version>_linux_x64.tar.gz and
      # gitleaks_<version>_checksums.txt) are verified against the pinned
      # release tag. The tarball sha256 is verified against the published
      # checksum file BEFORE extraction; findings make the job fail.
      - name: Install checksum-verified gitleaks
        run: |
          set -euo pipefail
          version="$(sed -n 's/^gitleaks_version[[:space:]]*:=[[:space:]]*"\([^"]*\)".*/\1/p' justfile)"
          test -n "${version}"
          asset="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --silent --show-error --location --output "${asset}" "${base}/${asset}"
          curl --fail --silent --show-error --location --output checksums.txt "${base}/gitleaks_${version}_checksums.txt"
          grep " ${asset}\$" checksums.txt > sha256sums.txt
          sha256sum --check --strict sha256sums.txt
          tar --extract --gzip --file "${asset}" gitleaks
          install --mode 0755 --directory "${HOME}/.local/bin"
          install --mode 0755 gitleaks "${HOME}/.local/bin/gitleaks"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Scan Git history for secrets
        run: gitleaks detect --source . --no-banner
